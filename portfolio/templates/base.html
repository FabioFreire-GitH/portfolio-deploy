{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meu Portfólio{% endblock %}</title>
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="nav-logo">
                <h1>Fábio Freire</h1>
            </div>
            <nav class="nav-links">
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'lista_projetos' %}" class="{% if request.resolver_match.url_name == 'lista_projetos' or request.resolver_match.url_name == 'detalhes_projeto' %}active{% endif %}">Projetos</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2026 Fábio Freire. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
